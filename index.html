<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>ATGeneral — We'll be back soon</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7faf5;
      color: #111510;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .page {
      width: 100%;
      max-width: 760px;
      text-align: center;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.8px;
      margin-bottom: 72px;
    }

    .logo span {
      color: #55b928;
      font-size: 24px;
      line-height: 1;
    }

    .eyebrow {
      display: inline-block;
      padding: 8px 14px;
      border-radius: 999px;
      background: #e5f5dc;
      color: #37851d;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      margin-bottom: 24px;
    }

    h1 {
      margin: 0;
      font-size: clamp(48px, 8vw, 82px);
      line-height: .98;
      letter-spacing: -4px;
      font-weight: 750;
    }

    h1 span {
      color: #55b928;
    }

    p {
      max-width: 520px;
      margin: 28px auto 0;
      font-size: 18px;
      line-height: 1.65;
      color: #687064;
    }

    .line {
      width: 64px;
      height: 4px;
      border-radius: 4px;
      background: #55b928;
      margin: 36px auto 0;
    }

    .footer {
      margin-top: 100px;
      font-size: 13px;
      color: #92988f;
    }

    @media (max-width: 600px) {
      .logo { margin-bottom: 56px; }
      h1 { letter-spacing: -2.5px; }
      p { font-size: 16px; }
      .footer { margin-top: 72px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="logo">ATGENERAL<span>›</span></div>

    <div class="eyebrow">Under maintenance</div>

    <h1>We'll be back<br><span>soon.</span></h1>

    <p>
      We're making a few improvements behind the scenes.
      We'll be back shortly with something better.
    </p>

    <div class="line"></div>

    <div class="footer">© ATGeneral</div>
  </main>
</body>
</html>
